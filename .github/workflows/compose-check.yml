name: Compose Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v6

      - name: Salin .env.example ke .env
        run: cp .env.example .env

      - name: Validasi file Compose
        run: docker compose config -q
